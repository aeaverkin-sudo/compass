services:
  - type: web
    name: compass
    runtime: node
    plan: free
    buildCommand: npm ci && NODE_OPTIONS="--max-old-space-size=384" npm run build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: HOSTNAME
        value: 0.0.0.0
